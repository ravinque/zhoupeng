server {
    listen 80;
    listen [::]:80;
    server_name zhoupengindustry.com www.zhoupengindustry.com;
    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/zhoupengindustry.com/current; }
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
    location / { return 301 https://www.zhoupengindustry.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zhoupengindustry.com www.zhoupengindustry.com;
    ssl_certificate /etc/ssl/zhoupengindustry.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/zhoupengindustry.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    root /www/wwwroot/zhoupengindustry.com/current;
    index index.html;
    charset utf-8;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location ^~ /api/whatsapp/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
    location / { try_files $uri $uri/ $uri/index.html =404; }
    location ^~ /_next/static/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(?:avif|webp|jpg|jpeg|png|gif|svg|ico|woff2|mp4|webm)$ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
